# NOTE: This file is no longer read by anything. It configured the Upptime
# GitHub Actions workflows, which have been removed — monitoring and the
# status page now run on UptimeRobot (see README.md and scripts/). Kept only
# as a historical record of the original site list/config; edits here have
# no effect on the live status page.

# Change these first
owner: ShippersEdge # Your GitHub username
repo: upptime # Your GitHub repository name

# Add your sites here
sites:
  - name: ShippersEdge TMS
    url: https://app.shippersedge.com/health.cfm
  - name: ShippersEdge Carrier Portal
    url: https://carriers.shippersedge.com
  - name: ShippersEdge Supplier Portal
    url: https://routing.shippersedge.com
  - name: ShippersEdge Customer Portal
    url: https://customers.shippersedge.com
  - name: ShippersEdge Dock Scheduler
    url: https://schedule.shippersedge.com
 

status-website:
  # Add your custom domain below, or remove the next line if you don't have a domain
  cname: uptime.shippersedge.com
  # Uncomment the following line if you don't have a custom domain and add your repo name
  #baseUrl: /upptime
  logoUrl: https://app.shippersedge.com/images/logos/shippersedge-logo.png
  name: ShippersEdge Service Status
  #introTitle: "**Upptime** is the open-source uptime monitor and status page, powered entirely by GitHub."
  #introMessage: This is a sample status page which uses **real-time** data from our [GitHub repository](https://github.com/upptime/upptime). No server required — just GitHub Actions, Issues, and Pages. [**Get your own for free**](https://github.com/upptime/upptime)
  navbar:
    - title: Status
      href: /
    - title: ShippersEdge
      href: https://www.shippersedge.com

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
